services:
  db:
    image: pgvector/pgvector:pg16
    container_name: radar-macro-db
    environment:
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: radar123
      POSTGRES_DB: radar_macro
    ports:
      - "5432:5432"
    volumes:
      - radar_pgdata:/var/lib/postgresql/data 

volumes:
  radar_pgdata:
